name: Development Build

on:
  push:
    branches: [develop]

jobs:
  build:
    name: Build Development Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build development client
        run: eas build --platform ios --profile development --non-interactive

      - name: Get build URL
        id: build-url
        run: |
          BUILD_URL=$(eas build:list --platform ios --limit 1 --non-interactive --json | jq -r '.[0].buildDetailsPageUrl')
          echo "url=$BUILD_URL" >> $GITHUB_OUTPUT

      - name: Comment build link on commit
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🔧 **Development Build Started**\n\nInstall via Expo Orbit: ${process.env.BUILD_URL}\n\nThen run: \`npx expo start --dev-client\``
            });
        env:
          BUILD_URL: ${{ steps.build-url.outputs.url }}
