name: Production Release

on:
  workflow_dispatch:
    inputs:
      submit_to_app_store:
        description: 'Submit to App Store after build'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    name: Build Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production
        run: eas build --platform ios --profile production --non-interactive

      - name: Submit to App Store
        if: ${{ inputs.submit_to_app_store == 'true' }}
        run: eas submit --platform ios --profile production --non-interactive

      - name: Get build URL
        id: build-url
        run: |
          BUILD_URL=$(eas build:list --platform ios --limit 1 --non-interactive --json | jq -r '.[0].buildDetailsPageUrl')
          echo "url=$BUILD_URL" >> $GITHUB_OUTPUT

      - name: Comment build link on commit
        uses: actions/github-script@v7
        with:
          script: |
            const buildUrl = '${{ steps.build-url.outputs.url }}';
            const submitted = '${{ inputs.submit_to_app_store }}' === 'true';
            const submissionNote = submitted ? '\n\n✅ Submitted to App Store Connect' : '\n\nTo submit manually: `eas submit --platform ios --profile production`';
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚀 **Production Build Complete**\n\nView build: ${buildUrl}${submissionNote}`
            });
