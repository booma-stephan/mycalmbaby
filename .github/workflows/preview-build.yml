name: Preview Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - android
          - all

# Note: Automatic builds on push are disabled until EAS credentials
# are configured for internal distribution. To set up credentials:
#   1. Run `eas credentials` locally and configure ad-hoc provisioning
#   2. Then re-enable the push trigger below:
# on:
#   push:
#     branches: [main]

jobs:
  preview:
    name: Build Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'ios' }}"
          if [ "$PLATFORM" = "all" ]; then
            eas build --platform all --profile preview --non-interactive
          else
            eas build --platform $PLATFORM --profile preview --non-interactive
          fi

      - name: Get build URL
        id: build-url
        run: |
          BUILD_URL=$(eas build:list --platform ios --limit 1 --non-interactive --json | jq -r '.[0].buildDetailsPageUrl')
          echo "url=$BUILD_URL" >> $GITHUB_OUTPUT

      - name: Comment build link on commit
        uses: actions/github-script@v7
        with:
          script: |
            const buildUrl = '${{ steps.build-url.outputs.url }}';
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `📱 **Preview Build Started**\n\nView build progress: ${buildUrl}`
            });
